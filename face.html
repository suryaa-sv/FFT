<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .main {
            display: flex;
            height: 100vh;
        }


        /* LEFT SIDE */

        .left {
            width: 52%;
            padding: 40px;
            position: relative;
        }

        .facebook-logo {
            width: 60px;
            height: 60px;

            background-color: #1877f2;
            color: white;

            border-radius: 50%;

            font-size: 50px;
            font-weight: bold;

            text-align: center;
            line-height: 68px;
        }


        /* Pictures */

        .picture-area {
            width: 420px;
            height: 300px;

            margin: 20px auto;

            position: relative;
        }

        .photo-card {
            width: 200px;
            height: 270px;

            background-color: #ddd;

            border-radius: 15px;

            position: absolute;

            left: 130px;
            top: 0;

            text-align: center;

            overflow: hidden;

            border: 5px solid white;

            box-shadow: 0 2px 10px #aaa;
        }

        .person {
            font-size: 150px;
            padding-top: 50px;
        }

        .heart {
            position: absolute;

            right: -10px;
            bottom: 30px;

            width: 55px;
            height: 55px;

            background-color: #ff4081;
            color: white;

            border-radius: 50%;

            font-size: 35px;
            line-height: 55px;
        }

        .emoji {
            position: absolute;

            left: 70px;
            top: 20px;

            font-size: 45px;
        }

        .small-card {
            position: absolute;

            left: 20px;
            top: 80px;

            width: 100px;
            height: 110px;

            background-color: #eee;

            border-radius: 12px;

            font-size: 50px;

            text-align: center;

            padding-top: 25px;

            box-shadow: 0 2px 8px #aaa;
        }

        .bottom-card {
            position: absolute;

            left: 80px;
            bottom: -30px;

            width: 130px;
            height: 110px;

            background-color: white;

            border-radius: 12px;

            font-size: 55px;

            text-align: center;

            padding-top: 20px;

            box-shadow: 0 2px 8px #aaa;
        }


        /* Left Heading */

        .left h1 {
            font-size: 58px;

            line-height: 1.12;

            margin-top: 40px;

            color: #111;
        }

        .left h1 span {
            color: #1877f2;
        }


        /* RIGHT SIDE */

        .right {
            width: 48%;

            border-left: 1px solid #ddd;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* Login Box */

        .login-box {
            width: 550px;

            padding: 20px;
        }

        .login-box h2 {
            font-size: 17px;

            margin-bottom: 25px;
        }


        /* Input Boxes */

        .login-box input {
            width: 100%;

            height: 60px;

            border: 1px solid #aaa;

            border-radius: 15px;

            padding: 15px;

            margin-bottom: 12px;

            font-size: 14px;
        }


        /* Login Button */

        .login-btn {
            width: 100%;

            height: 45px;

            border: none;

            border-radius: 25px;

            background-color: #0866ff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #0055d4;
        }


        /* Forgot Password */

        .login-box a {
            display: block;

            text-align: center;

            margin: 25px 0;

            color: #111;

            text-decoration: none;

            font-size: 15px;
        }

        .login-box a:hover {
            text-decoration: underline;
        }


        /* Line */

        .login-box hr {
            border: none;

            border-top: 1px solid #ddd;

            margin: 60px 0 25px;
        }


        /* Create Account Button */

        .create-btn {
            width: 100%;

            height: 45px;

            border: 1px solid #0866ff;

            border-radius: 25px;

            background-color: white;

            color: #0866ff;

            font-size: 16px;

            cursor: pointer;
        }

        .create-btn:hover {
            background-color: #f0f7ff;
        }


        /* Meta */

        .meta {
            text-align: center;

            margin-top: 25px;

            font-size: 16px;
        }

        .meta b {
            color: #0866ff;

            font-size: 22px;
        }


        /* MOBILE */

        @media (max-width: 800px) {

            .main {
                display: block;
            }

            .left {
                display: none;
            }

            .right {
                width: 100%;

                height: 100vh;

                border: none;
            }

            .login-box {
                width: 90%;
            }
        }

    </style>

</head>

<body>

    <div class="main">


        <!-- LEFT SECTION -->

        <div class="left">

            <!-- Facebook Logo -->

            <div class="facebook-logo">
                f
            </div>


            <!-- Picture Section -->

            <div class="picture-area">

                <div class="emoji">
                    😂
                </div>


                <div class="photo-card">

                    <div class="person">
                        👩🏾
                    </div>

                    <div class="heart">
                        ♥
                    </div>

                </div>


                <div class="small-card">
                    🌿
                </div>


                <div class="bottom-card">
                    🛹
                </div>

            </div>


            <!-- Main Text -->

            <h1>
                Explore<br>
                the things<br>
                <span>you love</span>.
            </h1>

        </div>



        <!-- RIGHT SECTION -->

        <div class="right">

            <div class="login-box">

                <h2>
                    Log in to Facebook
                </h2>


                <!-- Email -->

                <input
                    type="text"
                    placeholder="Email address or mobile number"
                >


                <!-- Password -->

                <input
                    type="password"
                    placeholder="Password"
                >


                <!-- Login -->

                <button class="login-btn">
                    Log in
                </button>


                <!-- Forgot Password -->

                <a href="#">
                    Forgotten password?
                </a>


                <!-- Divider -->

                <hr>


                <!-- Create Account -->

                <button class="create-btn">
                    Create new account
                </button>


                <!-- Meta -->

                <div class="meta">
                    <b>∞</b> Meta
                </div>

            </div>

        </div>

    </div>

</body>
</html>
